<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#3a2fb8"/>
    </linearGradient>
  </defs>
  <!-- Fundo: quadrado arredondado -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- "N" estilizado: duas hastes e a diagonal -->
  <g fill="#ffffff">
    <rect x="262" y="262" width="132" height="500" rx="28"/>
    <rect x="630" y="262" width="132" height="500" rx="28"/>
    <polygon points="262,262 394,262 762,762 630,762"/>
  </g>
  <!-- Corte: faixa diagonal que "separa" o N, como um corte na timeline -->
  <polygon points="150,640 874,316 874,384 150,708" fill="#3a2fb8" opacity="0.9"/>
</svg>
