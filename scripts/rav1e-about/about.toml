# Configuração do cargo-about para listar os crates compilados na biblioteca estática do rav1e
# (o build BtbN usa `cargo cinstall --release`, ou seja, features padrão + capi).
# Uso: ver scripts/rav1e-licenses.mjs
targets = ["x86_64-pc-windows-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
